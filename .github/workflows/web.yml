name: Web editor

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      SOCKET_API_KEY: ${{ secrets.SOCKET_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jqapi-web/package-lock.json
      - uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        if: ${{ env.SOCKET_API_KEY != '' }}
        with:
          mode: firewall-enterprise
          socket-token: ${{ env.SOCKET_API_KEY }}
      - run: npm ci --ignore-scripts
        working-directory: jqapi-web
      - name: Rebuild the vendored TeaVM bridge
        run: |
          mvn -B -DskipTests install
          mvn -f jqapi-wasm/pom.xml -B clean package
          cp jqapi-wasm/target/js/jqapi.js jqapi-web/src/wasm/jqapi.js
          git diff --exit-code -- jqapi-web/src/wasm/jqapi.js
      - run: npm run lint && npm run test && npm run build
        working-directory: jqapi-web
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: jqapi-web

  osv:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
    with:
      scan-args: --lockfile=jqapi-web/package-lock.json
